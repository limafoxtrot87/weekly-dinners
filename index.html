<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>This Week's Dinners</title>
<meta name="description" content="Four dinners and a grocery checklist, in store order.">
<meta name="theme-color" content="#FBF6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16100E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23B3341F'/><path d='M30 22v24a8 8 0 0 0 8 8v24M38 22v24M46 22v56M64 22c-5 6-6 14-6 22 0 6 3 9 6 9v25' stroke='white' stroke-width='7' stroke-linecap='round' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --ground:#FBF6F2; --surface:#FFFFFF; --surface-sub:#F6EFE9;
    --line:#EADFD6; --line-strong:#D6C4B7;
    --ink:#3A1611; --ink-soft:#7A5449; --ink-faint:#9C8176;
    --accent:#B3341F; --accent-ink:#FFFFFF; --accent-wash:#FBEAE5;
    --gold:#8A6010; --gold-wash:#FAF0DC;
    --sec-produce:#4A7430; --sec-bakery:#8A6010; --sec-meat:#B3341F;
    --sec-dairy:#456790; --sec-center:#74508B; --sec-frozen:#2C737D; --sec-pantry:#7E675E;
    --r:16px; --r-s:10px;
    --shadow-1:0 1px 2px rgba(58,22,17,.05), 0 4px 12px rgba(58,22,17,.05);
    --shadow-2:0 2px 4px rgba(58,22,17,.06), 0 12px 28px rgba(58,22,17,.09);
    --display:"Playfair Display", Georgia, serif;
    --ui:"Karla", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#16100E; --surface:#1F1714; --surface-sub:#271D19;
      --line:#3A2C26; --line-strong:#523E35;
      --ink:#F6EDE7; --ink-soft:#C4AEA4; --ink-faint:#9A857B;
      --accent:#EE7256; --accent-ink:#2A0C06; --accent-wash:#3A1C15;
      --gold:#DDA53C; --gold-wash:#33280F;
      --sec-produce:#8DBE68; --sec-bakery:#DDA53C; --sec-meat:#EE7256;
      --sec-dairy:#84A8D3; --sec-center:#BB93D0; --sec-frozen:#5FB4BE; --sec-pantry:#B39C91;
      --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.42);
    }
  }
  :root[data-theme="dark"] {
    --ground:#16100E; --surface:#1F1714; --surface-sub:#271D19;
    --line:#3A2C26; --line-strong:#523E35;
    --ink:#F6EDE7; --ink-soft:#C4AEA4; --ink-faint:#9A857B;
    --accent:#EE7256; --accent-ink:#2A0C06; --accent-wash:#3A1C15;
    --gold:#DDA53C; --gold-wash:#33280F;
    --sec-produce:#8DBE68; --sec-bakery:#DDA53C; --sec-meat:#EE7256;
    --sec-dairy:#84A8D3; --sec-center:#BB93D0; --sec-frozen:#5FB4BE; --sec-pantry:#B39C91;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 14px 32px rgba(0,0,0,.42);
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--ui); font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%; padding-bottom:3.5rem;
  }
  .wrap { max-width:660px; margin:0 auto; padding:0 16px; }
  svg { display:block; }

  /* ---------- header ---------- */
  .topbar {
    position:sticky; top:0; z-index:30; background:var(--ground);
    padding-top:max(16px, env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
  }
  .topbar-inner { max-width:660px; margin:0 auto; padding:0 16px 14px; }
  .kicker {
    display:flex; align-items:center; gap:7px;
    font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:var(--accent);
  }
  .kicker svg { width:13px; height:13px; }
  h1 {
    font-family:var(--display); font-weight:700; font-size:clamp(27px, 7.5vw, 34px);
    line-height:1.1; letter-spacing:-.015em; margin:5px 0 12px; text-wrap:balance;
  }
  .meter { display:flex; align-items:center; gap:11px; }
  .track { flex:1; height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
  .fill { height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--gold)); border-radius:99px; transition:width .3s cubic-bezier(.4,0,.2,1); }
  .tally { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }

  .tabs { display:flex; gap:4px; margin-top:14px; background:var(--surface-sub); padding:4px; border-radius:var(--r-s); }
  .tab {
    flex:1; appearance:none; border:0; background:transparent; cursor:pointer;
    color:var(--ink-soft); font-family:var(--ui); font-size:14px; font-weight:600;
    padding:9px 8px; border-radius:7px; transition:background .2s ease, color .2s ease;
  }
  .tab[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1); }
  .tab:focus-visible, .row:focus-visible, .ghost:focus-visible, .rc-toggle:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .panel { padding-top:18px; }
  .panel[hidden] { display:none; }

  /* ---------- shopping list ---------- */
  .sec {
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow-1); margin-bottom:14px; overflow:hidden;
  }
  .sec-head { display:flex; align-items:center; gap:10px; padding:13px 16px 12px; border-bottom:1px solid var(--line); }
  .sec-rule { width:3px; height:16px; border-radius:2px; background:var(--hue,var(--ink-faint)); flex:none; }
  .sec-name {
    font-family:var(--ui); font-size:12px; font-weight:700; letter-spacing:.11em;
    text-transform:uppercase; color:var(--hue,var(--ink));
  }
  .sec-count { margin-left:auto; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--ink-faint); }

  .row {
    display:flex; align-items:flex-start; gap:13px; width:100%; min-height:52px;
    padding:12px 16px; background:none; border:0; border-top:1px solid var(--line);
    text-align:left; font:inherit; color:inherit; cursor:pointer;
    -webkit-tap-highlight-color:transparent; transition:background .15s ease;
  }
  .row:first-of-type { border-top:0; }
  .row:hover, .row:active { background:var(--surface-sub); }
  .box {
    flex:none; width:24px; height:24px; margin-top:1px; border:2px solid var(--line-strong);
    border-radius:8px; display:grid; place-items:center; color:var(--accent-ink);
    transition:background .18s ease, border-color .18s ease;
  }
  .box svg { width:14px; height:14px; opacity:0; transition:opacity .18s ease; }
  .row[aria-checked="true"] .box { background:var(--accent); border-color:var(--accent); }
  .row[aria-checked="true"] .box svg { opacity:1; }

  .cell { min-width:0; flex:1; }
  .item { font-size:15.5px; line-height:1.35; text-wrap:pretty; }
  .qty { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:-.02em; }
  .row[aria-checked="true"] .item { text-decoration:line-through; text-decoration-thickness:1.5px; color:var(--ink-faint); }

  .tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .tag {
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:99px; background:var(--accent-wash); color:var(--accent);
  }
  .row[aria-checked="true"] .tag { opacity:.4; }
  .flag {
    display:flex; gap:7px; margin-top:8px; font-size:12.5px; line-height:1.4;
    color:var(--gold); background:var(--gold-wash); padding:7px 10px; border-radius:var(--r-s);
  }
  .flag svg { width:14px; height:14px; flex:none; margin-top:2px; }

  .sec.pantry { background:transparent; border-style:dashed; box-shadow:none; }

  .note {
    display:flex; gap:11px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow-1); margin-bottom:14px;
  }
  .note > svg { width:17px; height:17px; color:var(--accent); flex:none; margin-top:2px; }
  .note-t { font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
  .note p { margin:0; font-size:14px; line-height:1.55; color:var(--ink-soft); }

  /* ---------- recipes ---------- */
  .rc {
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow-2); margin-bottom:18px; overflow:hidden;
  }
  .shot { position:relative; aspect-ratio:16/10; background:var(--surface-sub); }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .shot::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(24,9,6,.88) 0%, rgba(24,9,6,.45) 34%, rgba(24,9,6,0) 62%);
  }
  .shot-txt { position:absolute; left:0; right:0; bottom:0; padding:16px 18px; z-index:1; }
  .daychip {
    display:inline-block; font-family:var(--ui); font-size:10.5px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:#fff;
    background:rgba(255,255,255,.18); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.32); padding:4px 10px; border-radius:99px; margin-bottom:9px;
  }
  .shot-name {
    font-family:var(--display); font-weight:700; font-size:clamp(21px, 5.6vw, 26px);
    line-height:1.15; color:#fff; text-wrap:balance; text-shadow:0 1px 14px rgba(0,0,0,.55);
  }
  /* No photo: same content, page-theme colors instead of the scrim. */
  .noshot { padding:20px 18px 4px; }
  .noshot .daychip { color:var(--accent); background:var(--accent-wash); border-color:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; }
  .noshot .shot-name { color:var(--ink); text-shadow:none; }

  .meta { display:flex; flex-wrap:wrap; gap:16px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .meta div { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .meta svg { width:14px; height:14px; color:var(--ink-faint); }

  .blurb { margin:0; padding:15px 18px; font-family:var(--display); font-style:italic; font-size:16px; line-height:1.5; color:var(--ink-soft); }

  .callout {
    display:flex; gap:9px; margin:0 18px 15px; padding:11px 13px;
    background:var(--gold-wash); color:var(--gold); border-radius:var(--r-s);
    font-size:13px; line-height:1.45; font-weight:500;
  }
  .callout svg { width:15px; height:15px; flex:none; margin-top:2px; }

  .rc-toggle {
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:15px; background:none; border:0; border-top:1px solid var(--line);
    font-family:var(--ui); font-size:13.5px; font-weight:700; letter-spacing:.03em;
    color:var(--accent); cursor:pointer; transition:background .15s ease;
  }
  .rc-toggle:hover { background:var(--accent-wash); }
  .rc-toggle svg { width:15px; height:15px; transition:transform .25s ease; }
  .rc[data-open="1"] .rc-toggle svg { transform:rotate(180deg); }

  .detail { padding:4px 18px 22px; border-top:1px solid var(--line); }
  .detail[hidden] { display:none; }
  .h {
    display:flex; align-items:center; gap:10px; margin:20px 0 10px;
    font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint);
  }
  .h::after { content:""; flex:1; height:1px; background:var(--line); }
  .grp { font-family:var(--ui); font-size:12.5px; font-weight:700; color:var(--ink); margin:14px 0 6px; }
  .ing { list-style:none; margin:0; padding:0; }
  .ing li {
    position:relative; padding:7px 0 7px 18px; font-size:14.5px; line-height:1.45;
    color:var(--ink-soft); border-bottom:1px solid var(--line);
  }
  .ing li:last-child { border-bottom:0; }
  .ing li::before { content:""; position:absolute; left:2px; top:15px; width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.5; }
  .steps { list-style:none; margin:0; padding:0; counter-reset:s; }
  .steps li {
    counter-increment:s; position:relative; padding:0 0 18px 38px;
    font-size:15px; line-height:1.6; color:var(--ink-soft);
  }
  .steps li::before {
    content:counter(s); position:absolute; left:0; top:-1px;
    width:26px; height:26px; border-radius:50%; background:var(--accent-wash); color:var(--accent);
    font-family:var(--display); font-weight:700; font-size:13.5px;
    display:grid; place-items:center;
  }
  .steps li:last-child { padding-bottom:0; }
  .reuse { display:flex; gap:9px; padding:12px 13px; background:var(--surface-sub); border-radius:var(--r-s); font-size:13.5px; line-height:1.5; color:var(--ink-soft); }
  .reuse svg { width:15px; height:15px; color:var(--accent); flex:none; margin-top:2px; }
  .src { margin:16px 0 0; font-size:13px; }
  .src a { color:var(--accent); font-weight:600; overflow-wrap:anywhere; }

  /* ---------- states ---------- */
  .msg { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:30px 20px; text-align:center; box-shadow:var(--shadow-1); }
  .msg h2 { font-family:var(--display); font-size:19px; margin:0 0 7px; }
  .msg p { margin:0; color:var(--ink-soft); font-size:14.5px; }
  .ghost {
    margin-top:16px; appearance:none; border:1px solid var(--line-strong); background:var(--surface);
    color:var(--ink); font-family:var(--ui); font-size:14px; font-weight:600;
    padding:10px 18px; border-radius:var(--r-s); cursor:pointer; transition:background .15s ease;
  }
  .ghost:hover { background:var(--surface-sub); }
  .skel { height:56px; border-top:1px solid var(--line); background:var(--surface-sub); animation:p 1.4s infinite; }
  @keyframes p { 0%,100%{opacity:.4} 50%{opacity:.85} }

  .foot { margin-top:22px; text-align:center; font-size:11.5px; color:var(--ink-faint); font-family:var(--mono); }
  .foot button { appearance:none; background:none; border:0; color:var(--ink-faint); font:inherit; text-decoration:underline; cursor:pointer; padding:9px; }


  /* ---------- archive ---------- */
  .filters { display:flex; flex-direction:column; gap:9px; margin-bottom:16px; }
  .frow { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .frow::-webkit-scrollbar { display:none; }
  .flab {
    flex:none; align-self:center; font-size:10.5px; font-weight:700; letter-spacing:.11em;
    text-transform:uppercase; color:var(--ink-faint); width:52px;
  }
  .chip {
    flex:none; appearance:none; cursor:pointer; white-space:nowrap;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
    font-family:var(--ui); font-size:13px; font-weight:600;
    padding:7px 13px; border-radius:99px; transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .arc { display:flex; flex-direction:column; gap:12px; }
  .card {
    display:flex; gap:0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); box-shadow:var(--shadow-1); overflow:hidden;
  }
  .card-img { flex:none; width:104px; background:var(--surface-sub); align-self:stretch; }
  .card-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-body { flex:1; min-width:0; padding:13px 14px; display:flex; flex-direction:column; gap:7px; }
  .card-name { font-family:var(--display); font-size:16px; font-weight:700; line-height:1.2; text-wrap:balance; }
  .card-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .mchip {
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:99px; background:var(--surface-sub); color:var(--ink-soft);
  }
  .mchip.pro { background:var(--accent-wash); color:var(--accent); }
  .card-foot { display:flex; align-items:center; gap:10px; margin-top:auto; padding-top:2px; }
  .served { font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
  .card-foot a { font-size:12px; font-weight:600; color:var(--accent); text-decoration:none; }
  .star {
    flex:none; appearance:none; border:0; background:none; cursor:pointer; padding:8px;
    margin:4px 4px 0 0; color:var(--line-strong); align-self:flex-start;
    transition:color .15s ease, transform .12s ease;
  }
  .star svg { width:22px; height:22px; }
  .star[aria-pressed="true"] { color:var(--gold); }
  .star[aria-pressed="true"] svg { fill:var(--gold); }
  .star:active { transform:scale(.88); }
  .star:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }

  .savebar {
    position:sticky; bottom:0; z-index:25; margin:16px -16px 0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -4px 16px rgba(58,22,17,.07);
  }
  .savebar[hidden] { display:none; }
  .savebar a {
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:var(--accent-ink); text-decoration:none;
    font-family:var(--ui); font-size:15px; font-weight:700;
    padding:13px; border-radius:var(--r-s);
  }
  .savebar p { margin:8px 0 0; font-size:11.5px; line-height:1.4; color:var(--ink-faint); text-align:center; }

  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>

  <g id="i-recycle"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35"/><path d="M12 3.6l2.6 4.4M12 3.6L9.4 8M4.8 15.8l2.4-4.6M4.8 15.8l5.2.3M19.2 15.8l-2.4-4.6M19.2 15.8l-5.2.3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-star"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></g>
  <g id="i-alert"><path d="M12 3.5 22 20H2L12 3.5zM12 10v4.5M12 17.4v.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs></svg>

<header class="topbar">
  <div class="topbar-inner">
    <div class="kicker"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-basket"/></svg><span id="kicker">Grocery run</span></div>
    <h1 id="title">This Week's Dinners</h1>
    <div class="meter">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tally" id="tally">&mdash;</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-list" aria-selected="true" aria-controls="panel-list">Shopping list</button>
      <button class="tab" role="tab" id="tab-menu" aria-selected="false" aria-controls="panel-menu">Recipes</button>
      <button class="tab" role="tab" id="tab-arc" aria-selected="false" aria-controls="panel-arc">Past</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="panel" id="panel-list" role="tabpanel" aria-labelledby="tab-list">
    <div class="sec"><div class="sec-head"><span class="sec-rule"></span><span class="sec-name">Loading</span></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div>
  <div class="panel" id="panel-menu" role="tabpanel" aria-labelledby="tab-menu" hidden></div>
  <div class="panel" id="panel-arc" role="tabpanel" aria-labelledby="tab-arc" hidden></div>
  <div class="foot" id="foot"></div>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var panelList = $("panel-list"), panelMenu = $("panel-menu");
  var elFill = $("fill"), elTally = $("tally"), elTitle = $("title"), elKicker = $("kicker"), elFoot = $("foot");
  var state = { checked: {}, key: null, ids: [] };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  }
  function icon(id) { return '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function slug(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return "i" + (h >>> 0).toString(36); }
  function hueFor(n) {
    n = String(n).toLowerCase();
    if (n.indexOf("produce") > -1) return "var(--sec-produce)";
    if (n.indexOf("baker") > -1) return "var(--sec-bakery)";
    if (n.indexOf("meat") > -1 || n.indexOf("seafood") > -1 || n.indexOf("deli") > -1) return "var(--sec-meat)";
    if (n.indexOf("dairy") > -1 || n.indexOf("egg") > -1) return "var(--sec-dairy)";
    if (n.indexOf("aisle") > -1 || n.indexOf("dry") > -1 || n.indexOf("pantry") > -1) return "var(--sec-center)";
    if (n.indexOf("frozen") > -1) return "var(--sec-frozen)";
    return "var(--sec-pantry)";
  }
  function fmtQty(t) {
    var m = String(t).match(/^([\d./¼½¾-]+(?:\s*(?:lb|oz|cups?|tsp|tbsp|cans?|bunch|head|pint|large|small|box|bag|jar|carton|stick|packs?)\b)?)\s+([\s\S]+)$/i);
    return m ? '<span class="qty">' + esc(m[1]) + "</span> " + esc(m[2]) : esc(t);
  }
  function load(k) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
  function save() { if (state.key) { try { localStorage.setItem(state.key, JSON.stringify(state.checked)); } catch (e) {} } }

  function rowHTML(it, sect, countable) {
    var id = slug(sect + "|" + it.text);
    if (countable) state.ids.push(id);
    var on = !!state.checked[id];
    var h = '<button class="row" role="checkbox" aria-checked="' + (on ? "true" : "false") + '" data-id="' + id + '">';
    h += '<span class="box">' + icon("i-check") + '</span><span class="cell">';
    h += '<span class="item">' + fmtQty(it.text) + "</span>";
    if (it.tags && it.tags.length) {
      h += '<span class="tags">' + it.tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</span>";
    }
    if (it.flag) h += '<span class="flag">' + icon("i-alert") + "<span>" + esc(it.flag) + "</span></span>";
    return h + "</span></button>";
  }

  function renderList(d) {
    var html = ""; state.ids = [];
    (d.sections || []).forEach(function (s) {
      html += '<section class="sec" style="--hue:' + hueFor(s.name) + '">';
      html += '<div class="sec-head"><span class="sec-rule"></span><span class="sec-name">' + esc(s.name) + '</span><span class="sec-count"></span></div>';
      (s.items || []).forEach(function (it) { html += rowHTML(it, s.name, true); });
      html += "</section>";
    });
    if (d.pantry && d.pantry.length) {
      html += '<section class="sec pantry" style="--hue:var(--sec-pantry)">';
      html += '<div class="sec-head"><span class="sec-rule"></span><span class="sec-name">' + esc(d.pantryTitle || "Probably have") + '</span><span class="sec-count"></span></div>';
      d.pantry.forEach(function (it) { html += rowHTML(it, "pantry", false); });
      html += "</section>";
    }
    if (d.reuse) {
      html += '<div class="note">' + icon("i-recycle") + '<div><div class="note-t">Reuse this week</div><p>' + esc(d.reuse) + "</p></div></div>";
    }
    panelList.innerHTML = html || '<div class="msg"><h2>Nothing on the list</h2><p>No grocery list has been published for this week yet.</p></div>';
    panelList.querySelectorAll(".row").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-id");
        state.checked[id] = !state.checked[id];
        b.setAttribute("aria-checked", state.checked[id] ? "true" : "false");
        save(); tally();
      });
    });
    tally();
  }

  function tally() {
    var done = 0;
    state.ids.forEach(function (i) { if (state.checked[i]) done++; });
    var total = state.ids.length;
    elTally.textContent = total ? done + "/" + total : "—";
    elFill.style.width = total ? Math.round(done / total * 100) + "%" : "0%";
    panelList.querySelectorAll(".sec").forEach(function (s) {
      var rows = s.querySelectorAll(".row"), c = 0;
      rows.forEach(function (r) { if (r.getAttribute("aria-checked") === "true") c++; });
      var l = s.querySelector(".sec-count");
      if (l) l.textContent = c + "/" + rows.length;
    });
  }

  function renderMenu(dinners) {
    if (!dinners || !dinners.length) {
      panelMenu.innerHTML = '<div class="msg"><h2>No recipes yet</h2><p>This week’s dinners have not been published.</p></div>';
      return;
    }
    panelMenu.innerHTML = dinners.map(function (d) {
      var inner = '<span class="daychip">' + esc(d.day || "") + '</span><div class="shot-name">' + esc(d.name) + "</div>";
      var head = d.image
        ? '<div class="shot"><img src="' + esc(d.image) + '" alt="' + esc(d.alt || d.name) + '" loading="lazy" decoding="async" data-fallback="1">' +
          '<div class="shot-txt">' + inner + "</div></div>"
        : '<div class="noshot">' + inner + "</div>";

      var meta = "";
      if (d.serves) meta += "<div>" + icon("i-users") + "<span>Serves " + esc(d.serves) + "</span></div>";
      if (d.active) meta += "<div>" + icon("i-flame") + "<span>" + esc(d.active) + " active</span></div>";
      if (d.total) meta += "<div>" + icon("i-clock") + "<span>" + esc(d.total) + " total</span></div>";
      if (meta) meta = '<div class="meta">' + meta + "</div>";

      var body = "";
      if (d.blurb) body += '<p class="blurb">' + esc(d.blurb) + "</p>";
      if (d.warn) body += '<div class="callout">' + icon("i-alert") + "<span>" + esc(d.warn) + "</span></div>";

      var det = "";
      if (d.ingredients && d.ingredients.length) {
        det += '<div class="h">Ingredients</div>';
        d.ingredients.forEach(function (g) {
          if (g.group) det += '<div class="grp">' + esc(g.group) + "</div>";
          det += '<ul class="ing">' + (g.items || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
        });
      }
      if (d.directions && d.directions.length) {
        det += '<div class="h">Directions</div><ol class="steps">' +
               d.directions.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>";
      }
      if (d.reuse) det += '<div class="h">Reuse</div><div class="reuse">' + icon("i-recycle") + "<span>" + esc(d.reuse) + "</span></div>";
      if (d.source) {
        var u = String(d.source).match(/https?:\/\/\S+/);
        det += '<p class="src">' + (u ? '<a href="' + esc(u[0]) + '" target="_blank" rel="noopener">View the original recipe</a>' : esc(d.source)) + "</p>";
      }

      return '<article class="rc" data-open="0">' + head + meta + body +
        '<button class="rc-toggle" aria-expanded="false"><span>Ingredients &amp; directions</span>' + icon("i-chev") + "</button>" +
        '<div class="detail" hidden>' + det + "</div></article>";
    }).join("");

    /* A blocked or dead photo host degrades to the no-photo card, not a broken image. */
    panelMenu.querySelectorAll("img[data-fallback]").forEach(function (img) {
      img.addEventListener("error", function () {
        var shot = img.closest(".shot");
        if (!shot) return;
        var txt = shot.querySelector(".shot-txt");
        var holder = document.createElement("div");
        holder.className = "noshot";
        if (txt) holder.innerHTML = txt.innerHTML;
        shot.parentNode.replaceChild(holder, shot);
      });
    });

    panelMenu.querySelectorAll(".rc-toggle").forEach(function (b) {
      b.addEventListener("click", function () {
        var card = b.closest(".rc"), det = card.querySelector(".detail");
        var open = det.hasAttribute("hidden");
        if (open) { det.removeAttribute("hidden"); } else { det.setAttribute("hidden", ""); }
        b.setAttribute("aria-expanded", open ? "true" : "false");
        card.setAttribute("data-open", open ? "1" : "0");
        b.querySelector("span").textContent = open ? "Hide details" : "Ingredients & directions";
      });
    });
  }


  /* ---------- archive: browse past recipes, filter, favorite ---------- */
  var panelArc = $("panel-arc");
  var arcState = { recipes: [], protein: "all", format: "all", favs: {} };

  function favLoad() {
    try { return JSON.parse(localStorage.getItem("dinnerFavs") || "{}"); }
    catch (e) { return {}; }
  }
  function favSave() {
    try { localStorage.setItem("dinnerFavs", JSON.stringify(arcState.favs)); } catch (e) {}
  }

  function uniq(list, key) {
    var seen = {}, out = [];
    list.forEach(function (r) {
      var v = r[key];
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    return out.sort();
  }

  function renderArc() {
    var rs = arcState.recipes.filter(function (r) {
      return (arcState.protein === "all" || r.protein === arcState.protein)
          && (arcState.format  === "all" || r.mealType === arcState.format);
    });

    var html = '<div class="filters">';
    html += '<div class="frow"><span class="flab">Protein</span>';
    html += ["all"].concat(uniq(arcState.recipes, "protein")).map(function (v) {
      return '<button class="chip" data-k="protein" data-v="' + esc(v) + '" aria-pressed="' +
             (arcState.protein === v ? "true" : "false") + '">' +
             esc(v === "all" ? "All" : v.charAt(0).toUpperCase() + v.slice(1)) + "</button>";
    }).join("") + "</div>";
    html += '<div class="frow"><span class="flab">Format</span>';
    html += ["all"].concat(uniq(arcState.recipes, "mealType")).map(function (v) {
      return '<button class="chip" data-k="format" data-v="' + esc(v) + '" aria-pressed="' +
             (arcState.format === v ? "true" : "false") + '">' + esc(v === "all" ? "All" : v) + "</button>";
    }).join("") + "</div></div>";

    if (!rs.length) {
      html += '<div class="msg"><h2>Nothing matches</h2><p>No past dinner fits both filters. Clear one and try again.</p></div>';
    } else {
      html += '<div class="arc">';
      rs.forEach(function (r) {
        var on = !!arcState.favs[r.id];
        var times = r.weeks.length;
        html += '<article class="card">';
        if (r.image) {
          html += '<div class="card-img"><img src="' + esc(r.image) + '" alt="' + esc(r.name) +
                  '" loading="lazy" decoding="async"></div>';
        }
        html += '<div class="card-body">';
        html += '<div class="card-name">' + esc(r.name) + "</div>";
        html += '<div class="card-meta"><span class="mchip pro">' + esc(r.protein) + "</span>" +
                '<span class="mchip">' + esc(r.mealType) + "</span>" +
                (r.active ? '<span class="mchip">' + esc(r.active) + "</span>" : "") + "</div>";
        html += '<div class="card-foot"><span class="served">' +
                (times > 1 ? "Made " + times + "×" : "Made once") + " · " + esc(r.weeks[r.weeks.length - 1]) +
                "</span>" + (r.source ? '<a href="' + esc(r.source) + '" target="_blank" rel="noopener">Recipe</a>' : "") +
                "</div></div>";
        html += '<button class="star" data-id="' + esc(r.id) + '" aria-pressed="' + (on ? "true" : "false") +
                '" aria-label="Favorite ' + esc(r.name) + '">' + icon("i-star") + "</button>";
        html += "</article>";
      });
      html += "</div>";
    }

    html += '<div class="savebar" id="savebar" hidden><a id="savelink" href="#"></a>' +
            '<p>Tapping this opens a pre-filled email. Send it and the Sunday planner picks your favorites up — that is what makes them count.</p></div>';

    panelArc.innerHTML = html;

    panelArc.querySelectorAll(".chip").forEach(function (b) {
      b.addEventListener("click", function () {
        arcState[b.getAttribute("data-k")] = b.getAttribute("data-v");
        renderArc();
      });
    });
    panelArc.querySelectorAll(".star").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-id");
        if (arcState.favs[id]) { delete arcState.favs[id]; } else { arcState.favs[id] = 1; }
        b.setAttribute("aria-pressed", arcState.favs[id] ? "true" : "false");
        favSave(); updateSaveBar();
      });
    });
    updateSaveBar();
  }

  function updateSaveBar() {
    var bar = $("savebar"), link = $("savelink");
    if (!bar || !link) return;
    var names = arcState.recipes.filter(function (r) { return arcState.favs[r.id]; })
                                .map(function (r) { return r.name; });
    if (!names.length) { bar.hidden = true; return; }
    bar.hidden = false;
    link.textContent = "Save " + names.length + " favorite" + (names.length > 1 ? "s" : "");
    var body = "These are our current favorites:\n\n" + names.map(function (n) { return "FAV: " + n; }).join("\n");
    link.href = "mailto:pabartel87@gmail.com?subject=" + encodeURIComponent("Dinner favorites") +
                "&body=" + encodeURIComponent(body);
  }

  function loadArchive() {
    arcState.favs = favLoad();
    fetch("archive.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (a) { arcState.recipes = a.recipes || []; renderArc(); })
      .catch(function (e) {
        panelArc.innerHTML = '<div class="msg"><h2>Couldn\u2019t load past recipes</h2><p></p></div>';
        panelArc.querySelector("p").textContent = "The archive file didn't load (" + e.message + ").";
      });
  }

  function bindTabs() {
    var tabs = [
      { b: $("tab-list"), p: panelList },
      { b: $("tab-menu"), p: panelMenu },
      { b: $("tab-arc"),  p: panelArc  }
    ];
    tabs.forEach(function (t, i) {
      t.b.addEventListener("click", function () {
        tabs.forEach(function (o, j) {
          o.b.setAttribute("aria-selected", i === j ? "true" : "false");
          o.p.hidden = i !== j;
        });
        if (i === 2 && !arcState.recipes.length) loadArchive();
        window.scrollTo(0, 0);
      });
    });
  }

  function footer(d) {
    elFoot.innerHTML = "";
    var s = document.createElement("div");
    s.textContent = d && d.generated ? "Published " + d.generated : "";
    var r = document.createElement("button");
    r.textContent = "Clear checkmarks";
    r.addEventListener("click", function () {
      state.checked = {}; save();
      panelList.querySelectorAll(".row").forEach(function (x) { x.setAttribute("aria-checked", "false"); });
      tally();
    });
    elFoot.appendChild(s); elFoot.appendChild(r);
  }

  bindTabs();

  fetch("data.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      if (d.week) elTitle.textContent = "Week of " + d.week;
      var b = [];
      if (d.store) b.push(d.store + " run");
      if (d.servings) b.push("cooking for " + d.servings);
      elKicker.textContent = b.join(" · ") || "Grocery run";
      state.key = "dinners:" + (d.week || "current");
      state.checked = load(state.key);
      renderList(d); renderMenu(d.dinners); footer(d);
    })
    .catch(function (e) {
      panelList.innerHTML = '<div class="msg"><h2>Couldn’t load this week’s plan</h2><p></p></div>';
      panelList.querySelector("p").textContent = "The weekly data file didn't load (" + e.message + "). It may still be publishing — try again in a minute.";
      var btn = document.createElement("button");
      btn.className = "ghost"; btn.textContent = "Reload";
      btn.addEventListener("click", function () { location.reload(); });
      panelList.querySelector(".msg").appendChild(btn);
    });
})();
</script>
</body>
</html>
